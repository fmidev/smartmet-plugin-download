# Note: order is significant
producers =
[
        "pal_skandinavia",
        "pal_skandinavia_dl",
        "ecmwf_skandinavia_painepinta",
        "ecmwf_eurooppa_pinta",
        "ecmwf_maailma_piste",
	"metcoop",
        "radar_finland_dbz",
        "radar_finland_rr1h",
        "radar_anjalankoski_dbzh",
        "radar_anjalankoski_etop",
        "radar_accrate"
];

# Decoded radar GeoTIFF/ODIM frames are written here as scratch querydata
radar:
{
        scratch_directory       = "tmp/radar-scratch";
};

// types: grid, points
// leveltypes: surface,pressure,model

pal_skandinavia:
{
        alias                   = "pal";
        directory               = "/usr/share/smartmet/test/data/pal";
        pattern                 = ".*_pal_skandinavia_pinta\.sqd$";
        forecast                = true;
        type                    = "grid";
        leveltype               = "surface";
        refresh_interval_secs   = 5;
        number_to_keep          = 2;
};

pal_skandinavia_dl:
{
        alias                   = "pal_dl";
        directory               = "/usr/share/smartmet/test/data/pal/download";
        pattern                 = ".*_pal_skandinavia_pinta\.sqd$";

#
#		Note: multifile must be true (to enable cross querydata fetches) for download plugin tests to succeed
#
        forecast                = true;

        type                    = "grid";
        leveltype               = "surface";
        refresh_interval_secs   = 5;
        number_to_keep          = 2;
	multifile		= true;
};

ecmwf_skandinavia_painepinta:
{
        alias                   = "ecpainepinta";
        directory               = "/usr/share/smartmet/test/data/ecpainepinta";
        pattern                 = "200809090714_ecmwf_skandinavia_painepinta240h\.sqd$";
        forecast                = true;
        type                    = "grid";
        leveltype               = "pressure";
        refresh_interval_secs   = 5;
        number_to_keep          = 1;
};

ecmwf_eurooppa_pinta:
{
        alias                   = "ec";
        directory               = "/usr/share/smartmet/test/data/ecpinta";
        pattern                 = ".*_ecmwf_eurooppa_pinta\.sqd$";
        forecast                = true;
        type                    = "grid";
        leveltype               = "surface";
        refresh_interval_secs   = 10;
        number_to_keep          = 1;
};

ecmwf_maailma_piste:
{
        alias                   = "ec";
        directory               = "/usr/share/smartmet/test/data/ecpiste";
        pattern                 = ".*_ecmwf_maailma_piste.*\.sqd$";
        forecast                = true;
        leveltype               = "points";
        refresh_interval_secs   = 10;
        number_to_keep          = 1;
};

metcoop:
{
        directory               = "/usr/share/smartmet/test/data/metcoop";
        pattern                 = ".*\.sqd$";
        forecast                = true;
        leveltype               = "surface";
        refresh_interval_secs   = 10;
        number_to_keep          = 1;
};

# Radar GeoTIFF (EPSG:3067) and ODIM HDF5 producers; the engine detects the
# file type from the extension and decodes the frames into querydata.

radar_finland_dbz:
{
        directory               = "/usr/share/smartmet/test/data/radar/geotiff/radar_finland_dbz_3067";
        pattern                 = ".*_radar_finland_dbz\.tif$";
        forecast                = false;
        type                    = "grid";
        leveltype               = "surface";
        refresh_interval_secs   = 60;
        number_to_keep          = 1;
};

radar_finland_rr1h:
{
        directory               = "/usr/share/smartmet/test/data/radar/geotiff/radar_finland_rr1h_3067";
        pattern                 = ".*_radar_finland_rr1h\.tif$";
        forecast                = false;
        type                    = "grid";
        leveltype               = "surface";
        refresh_interval_secs   = 60;
        number_to_keep          = 1;
};

radar_anjalankoski_dbzh:
{
        directory               = "/usr/share/smartmet/test/data/radar/geotiff/radar_anjalankoski_dbzh-cappi_3067";
        pattern                 = ".*_radar_anjalankoski_dbzh-cappi_500m\.tif$";
        forecast                = false;
        type                    = "grid";
        leveltype               = "surface";
        refresh_interval_secs   = 60;
        number_to_keep          = 1;
};

radar_anjalankoski_etop:
{
        directory               = "/usr/share/smartmet/test/data/radar/geotiff/radar_anjalankoski_etop_3067";
        pattern                 = ".*_radar_anjalankoski_etop_20dbz\.tif$";
        forecast                = false;
        type                    = "grid";
        leveltype               = "surface";
        refresh_interval_secs   = 60;
        number_to_keep          = 1;
};

radar_accrate:
{
        directory               = "/usr/share/smartmet/test/data/radar/hdf/accrate-5min";
        pattern                 = ".*_composite_cappi_600_rate_finradfast_filtered\.h5$";
        forecast                = false;
        type                    = "grid";
        leveltype               = "surface";
        refresh_interval_secs   = 60;
        number_to_keep          = 1;
};
