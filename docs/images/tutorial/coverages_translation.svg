<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" font-family="DejaVu Sans, Arial, sans-serif" font-size="14">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5 0 10z" fill="#444"/></marker>
<style>.box{fill:#f4f6fa;stroke:#334;stroke-width:1.5}.t{fill:#222}.s{fill:#555;font-size:12px}.h{font-weight:bold}.arrow{stroke:#444;stroke-width:1.5;fill:none;marker-end:url(#a)}.mono{font-family:DejaVu Sans Mono, monospace;font-size:12px}.k{fill:#1a5276}.note{fill:#a35a00;font-size:12px;font-style:italic}</style></defs>
<rect width="1000" height="470" fill="#fff"/>
<text class="t h" x="20" y="30" font-size="16">translateRequest(): an OGC API Coverages request becomes a /download request</text>

<rect class="box" x="20" y="55" width="440" height="330" rx="6"/>
<text class="t h" x="30" y="80">/coverages/collections/pal_skandinavia_dl/coverage</text>
<text class="mono k" x="30" y="110">properties=4</text>
<text class="mono k" x="30" y="135">f=grib2</text>
<text class="mono k" x="30" y="160">datetime=2013-09-17T10:00Z/2013-09-17T19:00Z</text>
<text class="mono k" x="30" y="185">subset=pressure(500:850)</text>
<text class="mono k" x="30" y="210">bbox=15,58,38,71</text>
<text class="mono k" x="30" y="235">scale-size=Lon(45),Lat(50)</text>
<text class="mono k" x="30" y="260">scale-factor=2</text>
<text class="mono k" x="30" y="285">scale-axes=Lon(10),Lat(10)</text>
<text class="mono k" x="30" y="310">crs=http://www.opengis.net/def/crs/EPSG/0/4326</text>
<text class="mono k" x="30" y="335">source=grid, origintime=…, packing=…</text>
<text class="s" x="30" y="365">(path segment {id})</text>

<rect class="box" x="540" y="55" width="440" height="330" rx="6"/>
<text class="t h" x="550" y="80">/download</text>
<text class="mono k" x="550" y="110">param=4</text>
<text class="mono k" x="550" y="135">format=GRIB2   (default NETCDF when f absent)</text>
<text class="mono k" x="550" y="160">starttime=…T10:00Z  endtime=…T19:00Z</text>
<text class="mono k" x="550" y="185">minlevel=500  maxlevel=850</text>
<text class="mono k" x="550" y="210">bbox=15,58,38,71   (unchanged)</text>
<text class="mono k" x="550" y="235">gridsize=45,50</text>
<text class="mono k" x="550" y="260">gridstep=2,2</text>
<text class="mono k" x="550" y="285">gridresolution=10,10</text>
<text class="mono k" x="550" y="310">projection=epsg:4326</text>
<text class="mono k" x="550" y="335">passed through unchanged</text>
<text class="mono k" x="550" y="365">producer=pal_skandinavia_dl</text>

<g class="arrow"><path d="M462 105 H538"/><path d="M462 130 H538"/><path d="M462 155 H538"/><path d="M462 180 H538"/><path d="M462 205 H538"/><path d="M462 230 H538"/><path d="M462 255 H538"/><path d="M462 280 H538"/><path d="M462 305 H538"/><path d="M462 330 H538"/><path d="M462 360 H538"/></g>

<text class="s" x="20" y="415">Then fillReqParams(), Query and createStreamer() run exactly as for /download. Only the response headers differ:</text>
<text class="s" x="20" y="435">/coverages sends a real MIME type (application/x-grib2, application/netcdf, image/tiff, …); /download always sends application/octet-stream.</text>
<text class="note" x="20" y="458">single datetime instant → starttime = endtime = t and timesteps=1</text>
</svg>
